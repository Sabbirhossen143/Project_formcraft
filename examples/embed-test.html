<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FormCraft Embed Test</title>
  <style>body{font:16px/1.6 Arial,sans-serif;max-width:760px;margin:60px auto;padding:0 24px;color:#172033}main{border:1px solid #e5e7eb;border-radius:16px;padding:28px}small{color:#64748b}</style>
</head>
<body>
  <main>
    <h1>External website test page</h1>
    <p>This page represents another website. Once the app is running and you have published a form, set the form slug in the script below.</p>
    <small>Click the floating FormCraft launcher in the bottom-right corner to open the chatbot.</small>
  </main>
  <!-- Replace YOUR_FORM_SLUG with a published form's slug. -->
  <script src="http://localhost:3000/formcraft-embed.js" data-formcraft-slug="YOUR_FORM_SLUG" data-formcraft-base="http://localhost:3000" defer></script>
</body>
</html>
